# This project's settings for ai-container (github.com/Andersoy/ai-container-template).
#
# Read on the host by ai-container, as data: one `name = value` per line, lists separated by spaces,
# # starts a comment. Every value is checked — a port must be a number, a host a host name — and
# anything else stops the launcher rather than being passed on. Read-only inside the container, so
# the agents cannot change their own settings.
format = 1

# The image everything is built on. Ubuntu 24.04 unless the project needs a toolchain image:
#   mcr.microsoft.com/dotnet/sdk:10.0-noble    .NET 10 (Ubuntu 24.04 underneath)
base_image = ubuntu:24.04

# Ubuntu packages on top of what the agents need. For example:
#   sqlite3 (~2 MB)  poppler-utils (~20 MB, reading PDFs)  postgresql-client (~30 MB)
#   python3-numpy (~30 MB)  build-essential (~200 MB, a C toolchain)
apt_packages =

# Dev-server ports, published to 127.0.0.1 only. They come ticked in the menu.
ports =

# Hosts Claude's own sandbox lets its shell commands reach, on top of the package registries
# (npm, NuGet and their certificate checks). Add the APIs the project calls when it runs in here.
sandbox_domains =

# Hosts --strict lets through, on top of the agents' own and the package registries.
strict_hosts =

# Names passed in from ~/.config/<project folder>/agent.env (chmod 600, outside the repository), for
# the agents' test runs against real APIs. Keys of their own with a small spend limit — with the web
# open, a key in here is a key that could leave. Never ANTHROPIC_API_KEY or OPENAI_API_KEY.
agent_keys =
